<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

<script>
(function () {
  'use strict';

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var body = document.getElementById('courseIntroBody');
  var id = getParam('id');
  var course = null;
  for (var i = 0; i < COURSES.length; i++) {
    if (COURSES[i].id === id) { course = COURSES[i]; break; }
  }

  document.title = (course ? course.name + ' — ' : '') + '课程介绍 — CUMT 数院电子资料库';
  var topic = document.getElementById('headerTopic');
  if (topic && course) topic.textContent = course.name;

  if (!course) {
    body.innerHTML = '<p class="pending-note">未找到该课程 (id=' + escapeHtml(id) + ')。' +
      '请从<a href="/curriculum.html">培养方案</a>或<a href="/">课程资料</a>页进入。</p>';
    return;
  }

  var detail = COURSE_INTROS[course.id] || {};

  // 基本信息标签
  var meta = [];
  if (course.credits) meta.push(course.credits + ' 学分');
  if (course.term) meta.push(course.term === '全' ? '学期不限' : course.term + '季学期');
  if (course.suggested) meta.push('建议第 ' + course.suggested + ' 学期');
  if (course.note) meta.push(course.note);

  // 教师列表
  var teachersHtml = '<p class="pending-note">暂无授课教师信息</p>';
  if (course.teachers && course.teachers.length > 0) {
    teachersHtml = '<ul>';
    for (var t = 0; t < course.teachers.length; t++) {
      var tc = course.teachers[t];
      teachersHtml += '<li>';
      if (tc.url) {
        teachersHtml += '<a href="' + escapeAttr(tc.url) + '" target="_blank">' + escapeHtml(tc.name) + '</a>';
      } else {
        teachersHtml += escapeHtml(tc.name);
      }
      teachersHtml += '</li>';
    }
    teachersHtml += '</ul>';
  }

  // 教材列表
  var booksHtml = '<p class="pending-note">暂无参考教材信息</p>';
  if (course.textbooks && course.textbooks.length > 0) {
    booksHtml = '<ul>';
    for (var b = 0; b < course.textbooks.length; b++) {
      var tb = course.textbooks[b];
      booksHtml += '<li>';
      if (tb && typeof tb === 'object') {
        booksHtml += '<a href="' + escapeAttr(tb.url) + '" target="_blank">' + escapeHtml(tb.title) + '</a>';
      } else {
        booksHtml += escapeHtml(tb);
      }
      booksHtml += '</li>';
    }
    booksHtml += '</ul>';
  }

  function section(title, contentHtml, pending) {
    return '<div class="course-intro-section">' +
      '<h2>' + title + '</h2>' +
      (contentHtml || '<p class="pending-note">' + pending + '</p>') +
      '</div>';
  }

  function mdToHtml(md) {
    if (!md) return '';
    try {
      // 先把数学公式与代码段抽出占位, 避免被 marked 当作 markdown 语法处理
      var math = [];
      var s = String(md)
        .replace(/```[\s\S]*?```|`[^`\n]*`/g, function (m) { math.push(m); return '\x00CK' + (math.length - 1) + '\x00'; })
        .replace(/\$\$[\s\S]*?\$\$/g, function (m) { math.push(m); return '\x00CK' + (math.length - 1) + '\x00'; })
        .replace(/\$[^$\n]+\$/g, function (m) { math.push(m); return '\x00CK' + (math.length - 1) + '\x00'; });
      var html = marked.parse(s);
      html = html.replace(/\x00CK(\d+)\x00/g, function (_, i) { return math[+i]; });
      return html;
    } catch (e) { return '<p>' + escapeHtml(md) + '</p>'; }
  }

  function typesetMath(el) {
    // MathJax 已就绪时对动态注入的内容排版; 未就绪时其启动流程会处理全文档
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([el]).catch(function () {});
    }
  }

  var html = '<h1>' + escapeHtml(course.name) +
    (course.nameEn ? '<span class="course-name-en"> ' + escapeHtml(course.nameEn) + '</span>' : '') + '</h1>';
  html += '<div class="course-intro-meta">';
  for (var m = 0; m < meta.length; m++) {
    html += '<span class="course-tag">' + escapeHtml(meta[m]) + '</span>';
  }
  html += '</div>';

  html += section('课程简介', mdToHtml(detail.intro), '介绍还在编写中, 欢迎投稿');
  html += section('授课教师', teachersHtml, '');
  html += section('教师评价', mdToHtml(detail.teachers), '教师评价还在编写中, 欢迎投稿');
  html += section('参考教材', booksHtml, '');
  html += section('推荐书籍', mdToHtml(detail.books), '推荐书目还在整理中, 欢迎投稿');

  html += '<p>历年试题与复习资料见<a href="/#courses">课程资料页</a>。</p>';

  body.innerHTML = html;
  typesetMath(body);
})();
</script>
