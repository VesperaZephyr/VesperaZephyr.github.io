<script>
(function () {
  'use strict';
  var body = document.getElementById('curriculumBody');
  var tocNav = document.getElementById('curriculumToc');
  if (!body) return;

  function slugify(text, used) {
    var base = 'sec-' + text.replace(/[^\u4e00-\u9fa5A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    var slug = base, i = 2;
    while (used[slug]) { slug = base + '-' + i++; }
    used[slug] = true;
    return slug;
  }

  fetch('24级数学系培养方案.md')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (md) {
      if (typeof marked === 'undefined') throw new Error('marked 未加载');
      var html = marked.parse(md);
      body.innerHTML = html;

      // 给 h2 加锚点并生成目录
      var used = {};
      var headings = body.querySelectorAll('h2');
      var tocList = tocNav ? tocNav.querySelector('ul') : null;
      for (var i = 0; i < headings.length; i++) {
        var h = headings[i];
        var id = slugify(h.textContent, used);
        h.id = id;
        if (tocList) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = h.textContent;
          li.appendChild(a);
          tocList.appendChild(li);
        }
      }
      if (tocList && headings.length > 0) tocNav.style.display = '';
    })
    .catch(function (err) {
      body.innerHTML = '<p class="curriculum-loading">培养方案加载失败 (' + err.message +
        '). 请刷新重试, 或直接查看仓库中的 <a href="24级数学系培养方案.md">Markdown 原文</a>.</p>';
    });
})();
</script>
